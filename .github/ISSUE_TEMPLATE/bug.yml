name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。安全漏洞请不要填写公开 Issue，请改用 SECURITY.md 中的私密渠道。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 打开……
        3. 点击……
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本或 commit
      placeholder: v0.1.0 / 87f0cca
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 运行方式
      options:
        - cargo run / 本地二进制
        - Docker Compose
        - 其他
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、架构、浏览器、ffmpeg 版本和相关配置。请移除 API key 与私人路径。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 只粘贴必要片段，请删除 token、API key、媒体真实路径和私人信息。
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过现有 Issue，没有发现相同问题。
          required: true
        - label: 这里不包含凭证、隐私或未公开漏洞细节。
          required: true
